<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink)}
.shell{display:flex;flex-direction:column;height:100dvh}
.chat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:20px}
.msg{display:flex}
.msg.user{justify-content:flex-end}
.bubble{max-width:min(720px,88%);padding:12px 16px;line-height:1.55;overflow-wrap:anywhere}
.bubble p+p,.bubble ul,.bubble ol,.bubble pre{margin-top:8px}
.bubble ul,.bubble ol{padding-left:22px}
.bubble pre{overflow-x:auto;padding:10px 12px;background:rgba(0,0,0,.12);border-radius:6px;font-size:.9em}
.bubble code{font-family:ui-monospace,Menlo,Consolas,monospace}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}
.chip{cursor:pointer;font:inherit;font-size:.9rem}
.composer{display:flex;gap:10px;padding:14px 20px}
.composer input{flex:1;min-width:0;font:inherit;color:inherit}
.composer input::placeholder{color:inherit;opacity:.55}
.composer button{cursor:pointer;font:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
.typing{display:inline-flex;gap:5px;padding:6px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
:root{--bg:#1b1830;--panel:#242040;--line:#322d57;--ink:#e6e2ff;--accent:#ff79c6;--cyan:#8be9fd;--yellow:#f1fa8c;--heading:"JetBrains Mono",monospace;--body:"JetBrains Mono",monospace}
body{font-size:14px}
.shell{max-width:940px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.top{display:flex;align-items:flex-end;gap:20px;padding:12px 16px 0;background:var(--panel);border-bottom:1px solid var(--line)}
.lights{display:flex;gap:6px;padding-bottom:14px}
.lights i{width:11px;height:11px;border-radius:50%;background:#ff5f7a}
.lights i:nth-child(2){background:#ffd166}
.lights i:nth-child(3){background:#56d6a0}
.tab{padding:9px 18px;background:var(--bg);border-radius:8px 8px 0 0;font-size:.9rem;font-weight:500;color:var(--yellow)}
.msg.user{justify-content:flex-start}
.bubble{max-width:100%;padding:4px 0 4px 16px;border-left:2px solid var(--cyan);border-radius:0}
.msg.user .bubble{border-left-color:var(--accent)}
.msg.bot .bubble::before{content:"tutor";display:block;margin-bottom:4px;font-size:.75rem;color:var(--cyan)}
.msg.user .bubble::before{content:"you";display:block;margin-bottom:4px;font-size:.75rem;color:var(--accent)}
.bubble pre{background:#120f24;border:1px solid var(--line)}
.bubble code{color:var(--yellow)}
.chip{background:transparent;color:var(--ink);border:1px dashed #5b53a3;border-radius:6px;padding:5px 10px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.composer{align-items:center;background:var(--panel);border-top:1px solid var(--line)}
.composer::before{content:">>>";color:var(--accent);font-weight:700}
.composer input{background:transparent;border:0;padding:8px 0}
.composer button{background:var(--accent);color:var(--bg);border:0;border-radius:6px;padding:8px 18px;font-weight:700}
</style>
</head>
<body>
<div class="shell">
<header class="top">
<div class="lights"><i></i><i></i><i></i></div>
<h1 class="tab">{{ title }}.py</h1>
</header>
<main id="chat" class="chat" aria-live="polite">
<div class="msg bot"><div class="bubble">{{ greeting }}</div></div>
</main>
<div id="chips" class="chips">
<button type="button" class="chip">What is recursion?</button>
<button type="button" class="chip">Explain Big O notation</button>
<button type="button" class="chip">List vs tuple in Python</button>
</div>
<form id="form" class="composer" autocomplete="off">
<input id="input" type="text" placeholder="Ask a programming question" aria-label="Your question" maxlength="1000" required>
<button id="send" type="submit">Send</button>
</form>
</div>
<script>
const chat = document.getElementById("chat");
const chips = document.getElementById("chips");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendButton = document.getElementById("send");
const history = [];

function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function formatInline(text) {
  return text
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

function formatParagraph(paragraph) {
  const lines = paragraph.split("\n");
  const bullet = /^\s*[-*]\s+/;
  const numbered = /^\s*\d+[.)]\s+/;

  if (lines.every((line) => bullet.test(line))) {
    const items = lines.map((line) => `<li>${formatInline(line.replace(bullet, ""))}</li>`);
    return `<ul>${items.join("")}</ul>`;
  }
  if (lines.every((line) => numbered.test(line))) {
    const items = lines.map((line) => `<li>${formatInline(line.replace(numbered, ""))}</li>`);
    return `<ol>${items.join("")}</ol>`;
  }
  return `<p>${formatInline(lines.join("<br>"))}</p>`;
}

function formatReply(text) {
  const parts = escapeHtml(text).split(/```[\w-]*\n?/);
  return parts
    .map((part, index) => {
      if (index % 2 === 1) {
        return `<pre><code>${part.trim()}</code></pre>`;
      }
      return part
        .trim()
        .split(/\n{2,}/)
        .filter(Boolean)
        .map(formatParagraph)
        .join("");
    })
    .join("");
}

function scrollToBottom() {
  chat.scrollTop = chat.scrollHeight;
}

function addMessage(role, text) {
  const message = document.createElement("div");
  message.className = `msg ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (role === "bot") {
    bubble.innerHTML = formatReply(text);
  } else {
    bubble.textContent = text;
  }
  message.appendChild(bubble);
  chat.appendChild(message);
  scrollToBottom();
}

function addTyping() {
  const message = document.createElement("div");
  message.className = "msg bot";
  message.innerHTML = '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
  chat.appendChild(message);
  scrollToBottom();
  return message;
}

function setBusy(busy) {
  input.disabled = busy;
  sendButton.disabled = busy;
  if (!busy) {
    input.focus();
  }
}

async function sendMessage(text) {
  chips.remove();
  addMessage("user", text);
  setBusy(true);
  const typing = addTyping();

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history }),
    });
    const data = await response.json();
    typing.remove();

    if (!response.ok) {
      throw new Error(data.error);
    }

    addMessage("bot", data.reply);
    history.push({ role: "user", text }, { role: "model", text: data.reply });
  } catch (error) {
    typing.remove();
    addMessage("bot", error.message || "Something went wrong. Please try again.");
  } finally {
    setBusy(false);
  }
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) {
    return;
  }
  input.value = "";
  sendMessage(text);
});

chips.addEventListener("click", (event) => {
  const chip = event.target.closest(".chip");
  if (chip) {
    sendMessage(chip.textContent);
  }
});
</script>
</body>
</html>
